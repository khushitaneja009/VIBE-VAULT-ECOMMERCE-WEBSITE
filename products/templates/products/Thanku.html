{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - VibeVault</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .thank-you-container {
            max-width: 600px;
            width: 100%;
            background-color: white;
            padding: 60px 40px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .icon-check {
            font-size: 70px;
            color: #28a745;
            margin-bottom: 25px;
            animation: scaleIn 0.6s ease-out 0.2s both;
        }
        
        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }
        
        .thank-you-container h1 {
            color: #333;
            font-size: 38px;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .thank-you-container p {
            font-size: 18px;
            color: #666;
            margin: 18px 0;
            line-height: 1.6;
        }
        
        .buttons-container {
            display: flex;
            gap: 15px;
            margin-top: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .thank-you-container .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            background-color: #80628f;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }
        
        .thank-you-container .back-button:hover {
            background-color: #6d5279;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(128, 98, 143, 0.4);
        }
        
        .thank-you-container .back-button.secondary {
            background-color: #6c757d;
        }
        
        .thank-you-container .back-button.secondary:hover {
            background-color: #5a6268;
            box-shadow: 0 8px 20px rgba(108, 117, 125, 0.4);
        }
        
        .thank-you-container .back-button i {
            margin-right: 8px;
        }
        
        .order-info {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin: 30px 0;
            border-left: 4px solid #28a745;
        }
        
        .order-info p {
            margin: 8px 0;
            color: #333;
            font-weight: 500;
        }
        
        @media (max-width: 600px) {
            .thank-you-container {
                padding: 40px 25px;
            }
            
            .thank-you-container h1 {
                font-size: 28px;
            }
            
            .buttons-container {
                flex-direction: column;
            }
            
            .thank-you-container .back-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="thank-you-container">
    <div class="icon-check">
        <i class="fas fa-check-circle"></i>
    </div>
    <h1>Thank You, {{ user_name }}!</h1>
    <p>Your order has been successfully placed! 🎉</p>
    
    <div class="order-info">
        <p><i class="fas fa-box"></i> We're preparing your order for shipment</p>
        <p><i class="fas fa-bell"></i> You'll receive updates via email and SMS</p>
    </div>
    
    <p>We appreciate your business and look forward to serving you again.</p>
    
    <div class="buttons-container">
        <a href="{% url 'all_products' %}" class="back-button">
            <i class="fas fa-shopping-bag"></i> Continue Shopping
        </a>
        <a href="{% url 'logout' %}" class="back-button secondary">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>
</div>

</body>
</html>
